services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    # 就绪探测：SQL Server 容器启动要十几秒，应用等它 healthy 再起，避免首次迁移连不上
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 用 Development：会开 Swagger，并自动种 admin/operator 账号
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # 关键：Server 用服务名 db（容器内部网络），用 SQL 认证而不是 Windows 认证
      ConnectionStrings__Default: "Server=db,1433;Database=ObjectDetectionDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY}"
      # 首次启动自动建表/跑迁移
      Database__AutoMigrate: "true"
    ports:
      - "5027:8080"
    restart: unless-stopped

volumes:
  mssql-data:
